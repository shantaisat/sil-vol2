<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set a new password | SILVOL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>

  <body>
    <main class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <a href="../index.html" class="navbar-brand">SILVOL</a>
          <a href="./login.html" class="font-medium">← Back to login</a>
        </div>

        <h1 class="auth-title">Set a new password</h1>
        <p class="auth-subtitle">Choose a new password for your account.</p>

        <form class="auth-form" data-auth-form="reset" novalidate>
          <div class="form-group">
            <label class="form-label" for="password">New password</label>
            <div class="input-wrap">
              <input
                class="form-input pr-10"
                type="password"
                id="password"
                name="password"
                placeholder="Create a new password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button
                type="button"
                class="input-toggle"
                data-toggle-password="password"
                aria-label="Show password"
              >
                <svg class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <p class="form-hint">At least 8 characters.</p>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">
              Confirm new password
            </label>
            <div class="input-wrap">
              <input
                class="form-input pr-10"
                type="password"
                id="confirm-password"
                name="confirm_password"
                placeholder="Confirm your new password"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="input-toggle"
                data-toggle-password="confirm-password"
                aria-label="Show password"
              >
                <svg class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <p class="hidden" data-form-message role="alert"></p>

          <button type="submit" class="btn-primary btn-block">
            Update password
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="../scripts/auth.js"></script>
  </body>
</html>
