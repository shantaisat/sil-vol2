<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password | SILVOL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>

  <body>
    <main class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <a href="../index.html" class="navbar-brand">SILVOL</a>
          <a href="./login.html" class="font-medium">← Back to login</a>
        </div>

        <div class="flex justify-center">
          <span class="icon-circle">
            <svg class="size-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V8a4 4 0 018 0v3" />
            </svg>
          </span>
        </div>

        <h1 class="auth-title">Forgot your password?</h1>
        <p class="auth-subtitle">
          No worries! Enter your email address and we'll send you a link to
          reset your password.
        </p>

        <form class="auth-form" data-auth-form="forgot" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>

          <p class="hidden" data-form-message role="alert"></p>

          <button type="submit" class="btn-primary btn-block">
            Send reset link
          </button>
        </form>

        <div class="panel-soft">
          <svg class="size-5 shrink-0 text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m22 7-10 7L2 7" />
          </svg>
          <div>
            <div class="font-medium text-ink">Check your inbox</div>
            <div>We'll send instructions to reset your password.</div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="../scripts/auth.js"></script>
  </body>
</html>
